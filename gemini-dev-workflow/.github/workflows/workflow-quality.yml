name: Workflow quality
on:
  pull_request:
  push:
    branches: [main, master, develop]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.16.2
      - run: python scripts/validate.py
      - name: Validate Gemini command TOML
        run: python -c "import pathlib,tomllib; [tomllib.loads(p.read_text()) for p in pathlib.Path('.gemini/commands').rglob('*.toml')]"
      - name: Unit and workflow regression coverage
        run: python -m coverage run --branch --source=scripts,.gemini/workflow/runtime -m unittest discover -s tests -p 'test_unit.py' -v
      - run: python -m coverage run --append --branch --source=scripts,.gemini/workflow/runtime -m unittest discover -s tests -p 'test_runtime*.py' -v
      - run: python -m coverage run --append --branch --source=scripts,.gemini/workflow/runtime -m unittest discover -s tests -p test_operations.py -v
      - run: python -m coverage report --fail-under=100
      - name: Model routing contract
        run: python -m unittest discover -s tests -p test_models.py -v
      - name: Installer integration
        run: python -m unittest discover -s tests -p test_integration.py -v
